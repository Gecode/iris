name: Conformance

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The compile-fail snapshots quote the standard library, from rust-src.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
      - name: Read Gecode pin
        id: reference
        run: |
          # --print-env requires an installed reference, so read its pin before restoring.
          sha=$(sed -n 's/^gecode_sha=//p' scripts/gecode-reference.sh)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Cache Gecode reference
        uses: actions/cache@v6
        with:
          path: .cache/gecode/${{ steps.reference.outputs.sha }}
          key: ${{ runner.os }}-${{ runner.arch }}-gecode-${{ steps.reference.outputs.sha }}-${{ hashFiles('scripts/gecode-reference.sh') }}
      - name: Build Gecode reference
        env:
          EXPECTED_SHA: ${{ steps.reference.outputs.sha }}
        run: |
          scripts/gecode-reference.sh
          eval "$(scripts/gecode-reference.sh --print-env)"
          test "$GECODE_REFERENCE_SHA" = "$EXPECTED_SHA"
      - name: Build Gecode adapter
        run: |
          adapter=$(conformance/adapters/gecode/build.sh)
          echo "adapter=$adapter" >> "$GITHUB_ENV"
      - name: Test Gecode adapter
        run: ctest --test-dir "$(dirname "$adapter")" --output-on-failure
      - name: Build Rust workspace, runner and driver
        working-directory: rust
        run: cargo build --workspace --locked
      - name: Check format library formatting
        run: rust/target/debug/iris fmt --check formats/
      - name: Check Specification examples
        run: (cd rust && cargo run --locked -p gecode-iris-conformance -- extract-examples ../spec/0.1 ../conformance/cases/0.1/spec-examples --check)
      - name: Check formal grammar
        run: (cd rust && cargo run --locked -p gecode-iris-conformance -- check-grammar)
      - name: Run Gecode conformance cases
        run: |
          skips=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            while read -r pattern; do
              [[ -z "$pattern" || "$pattern" == \#* ]] || skips+=(--skip "$pattern")
            done < conformance/adapters/gecode/libstdcxx-skips.txt
          fi
          (cd rust && cargo run --locked -p gecode-iris-conformance -- run --driver "\"$adapter\"" --driver-id gecode-6.5.0-599f977b7855 "${skips[@]}" ../conformance/cases/0.1)
      - name: Run Gecode format cases
        run: (cd rust && cargo run --locked -p gecode-iris-conformance -- run --driver "\"$adapter\"" --driver-id gecode-6.5.0-599f977b7855 ../formats)
      - name: Run Rust conformance cases
        run: (cd rust && cargo run --locked -p gecode-iris-conformance -- run --driver "\"$PWD/target/debug/iris-driver\"" ../conformance/cases/0.1)
      - name: Run Rust format cases
        run: (cd rust && cargo run --locked -p gecode-iris-conformance -- run --driver "\"$PWD/target/debug/iris-driver\"" ../formats)
      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Test EditorConfig support
        working-directory: rust
        run: cargo test --locked -p gecode-iris-syntax --features editorconfig
      - name: Build Rust documentation
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Read minimum supported Rust version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown
          components: rustfmt
      # rust/rust-toolchain.toml selects stable, so name the toolchain explicitly.
      - name: Build Rust workspace
        run: cargo "+${{ steps.msrv.outputs.version }}" build --workspace --locked
      # The compile-fail snapshots record stable's messages. Overwriting them
      # here still requires each case to fail to compile. The builder round
      # trip lints with the current clippy, in the builder-round-trip job.
      - name: Test Rust workspace
        env:
          TRYBUILD: overwrite
        run: cargo "+${{ steps.msrv.outputs.version }}" test --workspace --locked -- --skip accepted_specs_round_trip_through_the_rust_builder
      - name: Check browser crate on wasm32
        run: cargo "+${{ steps.msrv.outputs.version }}" check -p iris-wasm --target wasm32-unknown-unknown --locked
      - name: Check TypeScript binding crate on wasm32
        run: cargo "+${{ steps.msrv.outputs.version }}" check -p iris-js --target wasm32-unknown-unknown --locked

  builder-round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Round-trip accepted reader specs through the Rust builder
        working-directory: rust
        run: cargo test --locked -p gecode-iris --test builder_round_trip -- --nocapture
