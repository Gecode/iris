name: Java

on:
  push:
    paths:
      - 'java/**'
      - 'conformance/**'
      - 'formats/**'
      - 'rust/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'java/**'
      - 'conformance/**'
      - 'formats/**'
      - 'rust/**'
      - '.github/workflows/java.yml'

permissions:
  contents: read

concurrency:
  group: java-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ./gradlew build runs the style checks, every test, the whole conformance
# suite through the Rust runner, and the API reference, so each job needs Rust.
# It compiles and tests iris-jmh but runs no benchmarks.
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: java
    steps:
      # The conformance cases compare bytes, so check them out with LF.
      - name: Keep line endings
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
          cache-dependency-path: |
            java/**/*.gradle.kts
            java/gradle/libs.versions.toml
            java/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: java-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml') }}
          restore-keys: |
            java-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: java-test-reports-${{ matrix.os }}
          path: java/*/build/reports/tests/
