name: Python release

# Runs the whole Python workflow for a python-vVERSION tag, then uploads the wheels
# and source distribution it tested. See RELEASING.md.
on:
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag against the versions and the Rust release
        run: python3 -I scripts/versions.py release-check "$GITHUB_REF_NAME"

  build:
    name: Build and test
    needs: version
    uses: ./.github/workflows/python.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
