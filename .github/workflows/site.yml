name: Site

on:
  push:
    paths:
      - 'site/**'
      - 'brand/**'
      - 'formats/**'
      - 'rust/**'
      - 'spec/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'editors/textmate/**'
      - 'editors/jetbrains/README.md'
      - 'docs/formatting.md'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'brand/**'
      - 'formats/**'
      - 'rust/**'
      - 'spec/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'editors/textmate/**'
      - 'editors/jetbrains/README.md'
      - 'docs/formatting.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  # Keep an active production deployment running; newer pushes wait.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.credentials.outputs.enabled }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Identify Rust compiler
        id: compiler
        run: echo "identity=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen CLI
        id: bindings
        uses: actions/cache@v5
        with:
          path: ~/.cache/iris-site-tools/wasm-bindgen-0.2.129
          key: site-wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.129
      - name: Install wasm-bindgen CLI
        if: steps.bindings.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129 --root "$HOME/.cache/iris-site-tools/wasm-bindgen-0.2.129"
      - name: Add wasm-bindgen CLI to PATH
        run: echo "$HOME/.cache/iris-site-tools/wasm-bindgen-0.2.129/bin" >> "$GITHUB_PATH"
      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: site-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml', 'spec/0.1/grammar.ebnf', 'spec/0.1/errors.md') }}
          restore-keys: |
            site-cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Install browser for playground checks
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run check:browser
      - name: Check repository conventions
        working-directory: .
        run: scripts/check-repo.sh
      - name: Check deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Site deployment skipped: add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          fi
      - name: Upload checked site
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: site-dist
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Download checked site
        uses: actions/download-artifact@v7
        with:
          name: site-dist
          path: site/dist/
      - name: Deploy to iris.gecode.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
