name: TypeScript release

# Runs the whole TypeScript workflow for a typescript-vVERSION tag, then uploads the
# package it packed. See RELEASING.md.
on:
  push:
    tags:
      - 'typescript-v*'

permissions:
  contents: read

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag against the versions and the Rust release
        run: python3 -I scripts/versions.py release-check "$GITHUB_REF_NAME"

  build:
    name: Build and test
    needs: version
    uses: ./.github/workflows/typescript.yml

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: package
      - name: Check that npm supports trusted publishing
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"
      - name: Publish with provenance
        run: npm publish ./package/gecode-iris-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
