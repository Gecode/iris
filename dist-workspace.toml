[workspace]
members = ["cargo:rust"]

[dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
hosting = ["github"]
installers = ["shell", "powershell", "homebrew"]
tap = "Gecode/homebrew-tap"
formula = "iris"
# Generate the formula without publishing to the not-yet-created tap.
publish-jobs = []
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
tag-namespace = "rust-v"
pr-run-mode = "skip"

[dist.github-custom-runners]
# cargo-dist 0.32.0 defaults to macos-14, retired on 2026-11-02.
aarch64-apple-darwin = "macos-15"

[dist.github-action-commits]
"actions/checkout" = "v7"
"actions/upload-artifact" = "v6"
"actions/download-artifact" = "v7"
