[workspace]
members = ["gecode-iris", "iris-core", "iris-conformance", "iris-syntax", "iris-sema", "iris-cli", "iris-lsp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

# Distribution builds are separate from ordinary release/benchmark builds.
[profile.dist]
inherits = "release"
lto = "thin"
