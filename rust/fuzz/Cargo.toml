[package]
name = "iris-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# The fuzz crate needs nightly Rust, so it stays outside the stable workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
iris-core = { path = "../iris-core" }
iris-syntax = { path = "../iris-syntax" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = "warn"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false
