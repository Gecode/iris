[package]
name = "gecode-iris"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read text instance files with the Iris language"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gecode-iris"
keywords.workspace = true
categories = ["parsing"]
publish = false

[lints]
workspace = true

[dependencies]
gecode-iris-build = { version = "0.1.0", path = "../iris-build" }
gecode-iris-core = { version = "0.1.0", path = "../iris-core" }
gecode-iris-macros = { version = "0.1.0", path = "../iris-macros" }

[dev-dependencies]
# Path only: publication drops these, because gecode-iris-cli comes after this crate.
gecode-iris-cli = { path = "../iris-cli" }
gecode-iris-conformance = { version = "0.1.0", path = "../iris-conformance" }
gecode-iris-gen = { path = "../iris-gen" }
serde_json = "1.0"
trybuild = "1.0"
