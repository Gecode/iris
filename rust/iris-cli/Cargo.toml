[package]
name = "iris-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "iris"

[lints]
workspace = true

[[bin]]
name = "iris"
path = "src/bin/iris.rs"

[[bin]]
name = "iris-driver"
path = "src/bin/iris-driver.rs"

[dependencies]
iris-lsp = { path = "../iris-lsp" }
iris-syntax = { path = "../iris-syntax" }
iris-sema = { path = "../iris-sema" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ec4rs = "1.2"
similar = "2.7"

[dev-dependencies]
lsp-server = "0.10.0"
tempfile = "3"
iris-conformance = { path = "../iris-conformance" }
