[package]
name = "gecode-iris-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tools for reading instance files with Iris"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gecode-iris-cli"
keywords.workspace = true
categories = ["command-line-utilities", "parsing"]
publish = false
default-run = "iris"

[lints]
workspace = true

[[bin]]
name = "iris"
path = "src/bin/iris.rs"

[[bin]]
name = "iris-driver"
path = "src/bin/iris-driver.rs"

[dependencies]
gecode-iris-conformance = { version = "0.1.0", path = "../iris-conformance" }
gecode-iris-core = { version = "0.1.0", path = "../iris-core" }
gecode-iris-gen = { version = "0.1.0", path = "../iris-gen" }
gecode-iris-lsp = { version = "0.1.0", path = "../iris-lsp" }
gecode-iris-syntax = { version = "0.1.0", path = "../iris-syntax", features = ["editorconfig"] }
gecode-iris-sema = { version = "0.1.0", path = "../iris-sema" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"

[dev-dependencies]
lsp-server = "0.10.0"
tempfile = "3"
