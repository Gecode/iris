[package]
# The release component name lets dist parse the repository's rust-vVERSION tags.
# Cargo still builds the iris-cli package; release artifacts use the rust prefix.
name = "rust"
description = "Iris reader spec tools and language server"
repository = "https://github.com/Gecode/iris"
homepage = "https://github.com/Gecode/iris"
# iris-driver is a conformance tool, not part of the installed CLI.
binaries = ["iris"]

[dist]
# Binary releases are independent of crates.io publication (publish = false).
dist = true
display-name = "Iris"
