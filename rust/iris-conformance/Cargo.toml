[package]
name = "gecode-iris-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Language-neutral conformance runner for Iris implementations"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gecode-iris-conformance"
keywords.workspace = true
categories = ["development-tools::testing", "command-line-utilities"]

# The runner keeps the short command name.
[[bin]]
name = "iris-conformance"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "float_roundtrip"] }
shell-words = "1.1"
tempfile = "3"
toml = "1.1"

# The runner is a library and a developer tool: `cargo install` provides it, and
# binary releases carry only `iris`. Publishing no longer keeps it out of dist.
[package.metadata.dist]
dist = false
