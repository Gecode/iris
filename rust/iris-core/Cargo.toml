[package]
name = "gecode-iris-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Input reading, evaluation and column data for the Iris language"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/iris-core"
keywords.workspace = true
categories = ["parsing"]
publish = false

[lints]
workspace = true

[dependencies]
gecode-iris-syntax = { version = "0.1.0", path = "../iris-syntax" }
gecode-iris-sema = { version = "0.1.0", path = "../iris-sema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ryu = "1.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "formats"
path = "../benches/formats.rs"
harness = false
