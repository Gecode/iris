[package]
name = "iris-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Conformance driver of the Rust reference implementation of Iris"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[[bin]]
name = "iris-driver"
path = "src/main.rs"

# The `iris` command for this crate's tests, as Cargo only names the binaries
# of the package under test.
[[bin]]
name = "iris-cli-under-test"
path = "src/bin/iris-cli-under-test.rs"

[dependencies]
gecode-iris-cli = { path = "../iris-cli" }
gecode-iris-core = { path = "../iris-core" }

[dev-dependencies]
gecode-iris-conformance = { path = "../iris-conformance" }
gecode-iris-syntax = { path = "../iris-syntax" }
serde_json = "1.0"
tempfile = "3"
