[package]
name = "gecode-iris-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Language server for Iris reader specs"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gecode-iris-lsp"
keywords.workspace = true
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
gecode-iris-core = { version = "0.1.0", path = "../iris-core" }
gecode-iris-syntax = { version = "0.1.0", path = "../iris-syntax", features = ["editorconfig"] }
gecode-iris-sema = { version = "0.1.0", path = "../iris-sema" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
crossbeam-channel = "0.5.17"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
