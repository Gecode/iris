[package]
name = "iris-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Language server for Iris reader specs"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/iris-lsp"
keywords.workspace = true
categories = ["development-tools"]
publish = false

[lints]
workspace = true

[dependencies]
iris-core = { version = "0.1.0", path = "../iris-core" }
iris-syntax = { version = "0.1.0", path = "../iris-syntax", features = ["editorconfig"] }
iris-sema = { version = "0.1.0", path = "../iris-sema" }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
crossbeam-channel = "0.5.17"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
