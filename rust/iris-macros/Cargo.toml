[package]
name = "iris-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Compile-time checking for the gecode-iris iris! macro"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gecode-iris"
keywords.workspace = true
categories = ["parsing"]
publish = false

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
iris-syntax = { version = "0.1.0", path = "../iris-syntax" }
iris-sema = { version = "0.1.0", path = "../iris-sema" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3", default-features = false, features = ["parsing", "printing", "proc-macro"] }
