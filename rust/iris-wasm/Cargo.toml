[package]
name = "iris-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-memory Iris reader, checker and formatter for the browser playground"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
gecode-iris-core = { version = "0.1.0", path = "../iris-core" }
gecode-iris-syntax = { version = "0.1.0", path = "../iris-syntax", default-features = false }
gecode-iris-sema = { version = "0.1.0", path = "../iris-sema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
